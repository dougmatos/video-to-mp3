# Redireciona HTTP para HTTPS e serve o desafio ACME do certbot
server {
    listen 80;
    server_name yt.dougm.dev;

    # Rota necessária para a validação do Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy reverso para o servidor Node.js na porta 3092
server {
    listen 443 ssl;
    server_name yt.dougm.dev;

    ssl_certificate     /etc/letsencrypt/live/yt.dougm.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yt.dougm.dev/privkey.pem;

    # Parâmetros SSL recomendados pelo Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Cabeçalhos de segurança
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Proxy para o app Node.js
    location / {
        proxy_pass         http://app:3092;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
